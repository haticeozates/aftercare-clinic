name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run supabase:start
      - run: npm run db:reset
      - run: npm run db:lint
      - run: npm run test:db
      - run: npm run test:rls:local
      - run: npm run test:auth
      - run: npm run test:e2e:phase2
      - run: npm run test:templates
      - run: npm run test:e2e:phase3
      - run: npm run test:plans
      - run: npm run test:secure-links
      - run: npm run test:e2e:phase4
      - run: npm run test:portal
      - run: npm run test:e2e:phase5
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Secret scan placeholder
        run: |
          echo "Use GitHub secret scanning and add a dedicated scanner before production secrets exist."
      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop
